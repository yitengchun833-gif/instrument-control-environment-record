<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350"><rect width="1080" height="1350" fill="#0b1420"/><text x="70" y="85" fill="#bd91ff" font-family="Microsoft YaHei" font-size="25" letter-spacing="3">LOCAL AI STACK</text><text x="70" y="175" fill="#fff" font-family="Microsoft YaHei" font-size="60" font-weight="700">本地部署大模型</text><text x="70" y="250" fill="#fff" font-family="Microsoft YaHei" font-size="60" font-weight="700">可以降低持续调用成本</text><text x="70" y="305" fill="#9daeb9" font-family="Microsoft YaHei" font-size="25">同时把测试手册、历史 Bug 和 SOP 留在本地</text>
<g font-family="Microsoft YaHei"><rect x="70" y="390" width="940" height="150" rx="24" fill="#18213a" stroke="#8b6cc8"/><text x="110" y="445" fill="#d5baff" font-size="25">第一层｜本地推理</text><text x="110" y="495" fill="#fff" font-size="31" font-weight="700">开源模型 + 本地推理框架 + 工具调用</text><text x="110" y="525" fill="#9da9bd" font-size="20">完成自然语言解析、代码生成、日志总结与异常解释</text><rect x="70" y="585" width="940" height="150" rx="24" fill="#172b34" stroke="#57b7c8"/><text x="110" y="640" fill="#80e3f1" font-size="25">第二层｜RAG 知识增强</text><text x="110" y="690" fill="#fff" font-size="31" font-weight="700">仪器手册 + SCPI 文档 + 项目记录 + 测试规范</text><text x="110" y="720" fill="#9db2bd" font-size="20">优先解决知识检索和可追溯引用，不必先训练模型</text><rect x="70" y="780" width="940" height="150" rx="24" fill="#202b25" stroke="#75c98e"/><text x="110" y="835" fill="#9aebb0" font-size="25">第三层｜LoRA / PEFT</text><text x="110" y="885" fill="#fff" font-size="31" font-weight="700">用经过清洗的数据做领域行为适配</text><text x="110" y="915" fill="#a4b8ab" font-size="20">适合固定格式、术语和工作流；仍需评测集与版本治理</text></g>
<rect x="70" y="995" width="940" height="220" rx="24" fill="#2b211f" stroke="#ff9a75"/><text x="110" y="1055" fill="#ffac8d" font-family="Microsoft YaHei" font-size="28" font-weight="700">必须说清楚</text><text x="110" y="1110" fill="#fff" font-family="Microsoft YaHei" font-size="28">“无云端逐 Token 费用” ≠ “零成本”</text><text x="110" y="1160" fill="#cfb8b0" font-family="Microsoft YaHei" font-size="23">本地仍有 GPU / 内存 / 电力 / 运维 / 数据治理成本。</text><text x="110" y="1195" fill="#cfb8b0" font-family="Microsoft YaHei" font-size="23">多数实验室应先做推理 + RAG，再判断是否值得微调。</text>
</svg>
