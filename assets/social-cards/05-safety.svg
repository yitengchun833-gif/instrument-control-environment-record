<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350"><rect width="1080" height="1350" fill="#0b141d"/><text x="70" y="85" fill="#ff8d7d" font-family="Microsoft YaHei" font-size="25" letter-spacing="3">SAFETY BY DESIGN</text><text x="70" y="175" fill="#fff" font-family="Microsoft YaHei" font-size="62" font-weight="700">AI 能操作仪器</text><text x="70" y="250" fill="#fff" font-family="Microsoft YaHei" font-size="62" font-weight="700">更要被安全状态机约束</text>
<g font-family="Microsoft YaHei"><g fill="#122533" stroke="#41677d" stroke-width="2"><rect x="80" y="355" width="400" height="115" rx="20"/><rect x="600" y="355" width="400" height="115" rx="20"/><rect x="600" y="555" width="400" height="115" rx="20"/><rect x="80" y="555" width="400" height="115" rx="20"/><rect x="80" y="755" width="400" height="115" rx="20"/><rect x="600" y="755" width="400" height="115" rx="20"/></g><g fill="#fff" font-size="29" font-weight="700"><text x="115" y="405">01 识别仪器</text><text x="635" y="405">02 只读盘点</text><text x="635" y="605">03 强制输出 OFF</text><text x="115" y="605">04 设置软硬限制</text><text x="115" y="805">05 小范围试运行</text><text x="635" y="805">06 finally 关闭输出</text></g><g fill="#95adba" font-size="21"><text x="115" y="440">*IDN? / 资源匹配</text><text x="635" y="440">状态、量程、错误队列</text><text x="635" y="640">进入已知安全初态</text><text x="115" y="640">电压 / 电流 / 功率 / 超时</text><text x="115" y="840">单点验证后再扩展</text><text x="635" y="840">异常、暂停也执行收尾</text></g></g>
<g stroke="#ffcf61" stroke-width="5" fill="none"><path d="M480 412H585"/><path d="M800 470V540"/><path d="M600 612H495"/><path d="M280 670V740"/><path d="M480 812H585"/></g>
<rect x="70" y="955" width="940" height="250" rx="24" fill="#251b1c" stroke="#e06c60"/><text x="110" y="1020" fill="#ff9487" font-family="Microsoft YaHei" font-size="28" font-weight="700">关键原则</text><text x="110" y="1075" fill="#fff" font-family="Microsoft YaHei" font-size="28">大模型负责理解与生成方案；确定性程序负责执行。</text><text x="110" y="1125" fill="#fff" font-family="Microsoft YaHei" font-size="28">高风险写操作必须经过白名单、限值、审批和回读。</text><text x="110" y="1175" fill="#bfa9a9" font-family="Microsoft YaHei" font-size="23">AI 不替代接线检查、额定值核对、校准、联锁与工程责任。</text>
</svg>
