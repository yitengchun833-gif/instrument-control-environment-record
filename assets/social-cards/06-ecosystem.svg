<text x="70" y="1110" fill="#fff" font-family="Microsoft YaHei" font-size="29">接入前提：设备提供可控接口与文档化协议</text><text x="70" y="1160" fill="#9db2bd" font-family="Microsoft YaHei" font-size="24">SCPI / VISA 很常见，但并非唯一入口；SDK、REST、串口、工业协议同样可编排。</text><text x="70" y="1230" fill="#58e4ff" font-family="Microsoft YaHei" font-size="25">真正的上限由接口、带宽、同步、安全与组织治理共同决定。</text>
