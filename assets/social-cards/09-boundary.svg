<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350"><rect width="1080" height="1350" fill="#09131c"/><text x="70" y="85" fill="#5ee1ff" font-family="Microsoft YaHei" font-size="25" letter-spacing="3">CAPABILITY BOUNDARY</text><text x="70" y="175" fill="#fff" font-family="Microsoft YaHei" font-size="62" font-weight="700">AI 抬高的是系统上限</text><text x="70" y="250" fill="#fff" font-family="Microsoft YaHei" font-size="62" font-weight="700">不会改写物理定律</text>
<g font-family="Microsoft YaHei"><rect x="70" y="345" width="450" height="720" rx="28" fill="#10292b" stroke="#4ee2bc" stroke-width="2"/><text x="110" y="410" fill="#75f0cf" font-size="30" font-weight="700">AI 能显著提升</text><g fill="#fff" font-size="27"><text x="115" y="490">✓ 多设备组合与自动编排</text><text x="115" y="565">✓ 7×24 小时重复执行</text><text x="115" y="640">✓ 自适应扫描与异常复测</text><text x="115" y="715">✓ 海量日志关联分析</text><text x="115" y="790">✓ 自动图表、报告与追溯</text><text x="115" y="865">✓ 跨实验台远程协作</text><text x="115" y="940">✓ 快速把经验固化为 SOP</text></g><rect x="560" y="345" width="450" height="720" rx="28" fill="#2a1d20" stroke="#ef776c" stroke-width="2"/><text x="600" y="410" fill="#ff9186" font-size="30" font-weight="700">AI 不能凭空提升</text><g fill="#fff" font-size="27"><text x="605" y="490">× 仪器精度与校准能力</text><text x="605" y="565">× 模拟带宽与采样性能</text><text x="605" y="640">× 功率容量与物理量程</text><text x="605" y="715">× 硬件触发与同步精度</text><text x="605" y="790">× 接线、隔离与电气安全</text><text x="605" y="865">× 数据质量与因果真实性</text><text x="605" y="940">× 工程师的最终责任</text></g></g>
<rect x="70" y="1110" width="940" height="125" rx="22" fill="#112430" stroke="#31566c"/><text x="540" y="1160" text-anchor="middle" fill="#fff" font-family="Microsoft YaHei" font-size="27" font-weight="700">最佳形态：AI 编排 + 确定性执行 + 硬件保护 + 人类审批</text><text x="540" y="1200" text-anchor="middle" fill="#99b0bc" font-family="Microsoft YaHei" font-size="22">灵活度来自软件，可信度来自边界、证据和治理。</text>
</svg>
