<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350"><rect width="1080" height="1350" fill="#09131f"/><text x="70" y="85" fill="#82aaff" font-family="Microsoft YaHei" font-size="25" letter-spacing="3">DISTRIBUTED LAB</text><text x="70" y="175" fill="#fff" font-family="Microsoft YaHei" font-size="61" font-weight="700">一台电脑接口有限</text><text x="70" y="250" fill="#fff" font-family="Microsoft YaHei" font-size="61" font-weight="700">控制系统不必只有一台电脑</text>
